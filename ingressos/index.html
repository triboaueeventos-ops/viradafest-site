  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BDNSYNP9D8');
  </script>

  <!-- Meta Pixel (pixels virada) -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');

  <!-- Usa o link e a data de abertura do assets/js/config.js (não precisa editar este arquivo). -->
  <script src="../assets/js/config.js"></script>
  <script>
    (function () {
      var C = window.VF_CONFIG || {};
      var link = String(C.comprarUrl || '').trim();
      var abre = C.vendasAbremEm ? new Date(C.vendasAbremEm).getTime() : 0;
      var vendasAbertas = !!link && (!abre || Date.now() >= abre);
      var destino = vendasAbertas ? link : '../#setores';
      if (vendasAbertas && location.search) {
        try {
          var u = new URL(link), q = new URLSearchParams(location.search);
          ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid'].forEach(function (k) { if (q.get(k) && !u.searchParams.has(k)) u.searchParams.set(k, q.get(k)); });
          destino = u.toString();
        } catch (e) {}
      }

      var foi = false;
      function ir() { if (foi) return; foi = true; location.replace(destino); }

      if (vendasAbertas) {
        try { fbq('track', 'InitiateCheckout'); } catch (e) {}
        try {
          gtag('event', 'begin_checkout', {
            currency: 'BRL',
            items: [{ item_name: 'Réveillon Virada Fest 2027' }],
            transport_type: 'beacon',
            event_callback: ir
          });
        } catch (e) {}
      }
      // Espera no máximo 1 segundo pra registrar e segue pra compra.
      setTimeout(ir, vendasAbertas ? 1000 : 0);
    })();
  </script>
